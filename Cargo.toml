[package]
name = "quietprint"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
readme = "README.md"
description = "A purely passive TCP/IP operating system fingerprinting tool"

[features]
default = []
live = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
etherparse = "0.18"
pcap-file = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
